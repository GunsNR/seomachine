name: SuperTool CI

# Runs only when the app itself changes, so unrelated content commits in this
# workspace do not queue a build.
on:
  push:
    branches: [main]
    paths: ['supertool/**', 'docs/**', '.github/workflows/supertool.yml']
  pull_request:
    paths: ['supertool/**', 'docs/**', '.github/workflows/supertool.yml']

concurrency:
  group: supertool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: supertool

    # Phase 2 moved the product from SQLite to PostgreSQL with a reviewed
    # migration history. CI now runs the real engine: a schema that passes on
    # SQLite proves less than it appears to, because the two do not enforce
    # uniqueness, nulls or types identically.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supertool
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supertool_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Runtime traffic. In production this points at a pooled endpoint.
      DATABASE_URL: postgresql://supertool:ci-only-password@127.0.0.1:5432/supertool_ci?schema=public
      # Session-dependent work: migrations, pg_dump, pg_restore. Prisma requires
      # this once the datasource declares it — a missing DIRECT_URL is a hard
      # schema-load error, not a fallback. CI has no pooler, so it is the same
      # value; a hosted deployment points it at the direct endpoint.
      DIRECT_URL: postgresql://supertool:ci-only-password@127.0.0.1:5432/supertool_ci?schema=public
      PGPASSWORD: ci-only-password
      # Never a real secret; the app refuses to boot in production without one.
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supertool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify the migration applies to an empty database
        # `migrate deploy` rather than `db push`: this is the command that will
        # run against production, so it is the one CI must exercise. A drift
        # check afterwards proves the migrations and the schema agree — a
        # migration that no longer produces the declared schema is the failure
        # mode that only appears at deploy time.
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "No drift between migrations and schema"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Rehearse backup and restore
        # The migration is only half of a safe deploy. The other half is being
        # able to get back, and a backup nobody has restored is a hope rather
        # than a plan. This runs the real pg_dump/pg_restore pair against the
        # disposable service, then re-checks integrity on the restored copy, so
        # the procedure in docs/hosted-postgres-validation.md is executed on
        # every push instead of only being written down.
        run: npm run db:rehearse

      - name: Rehearse recovering from a failed migration
        # The backup rehearsal above proves the data can come back. This proves
        # the *deployment* can. It stages a real incident against a disposable
        # database — a migration that asserts one measurement run per project
        # per day, which legitimate same-day runs violate — then executes the
        # documented recovery: undo any partial DDL, `migrate resolve
        # --rolled-back`, redeploy, forward-fix. It fails the build if the
        # incident does not occur, if recovery does not restore a zero-drift
        # deployable schema, or if any tenant row changes along the way.
        #
        # The rehearsal migrations live in scripts/rehearsal-migrations/ and are
        # never added to prisma/migrations/, so nothing here can reach a real
        # database. See docs/operations-runbook.md §2.
        run: npm run db:recovery-drill

      - name: Smoke-test the running server
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "Server up after ${i}s"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Server did not start within 45s"
              exit 1
            fi
            sleep 1
          done

          # Health endpoint must report the database as reachable.
          curl -sf http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'

          # Key public routes must render.
          for path in / /pricing /platform /blog /tools/site-audit /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done

          # The dashboard must refuse an unauthenticated request.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/app)
          echo "/app (signed out) -> ${code}"
          [ "$code" = "307" ] || [ "$code" = "302" ] || exit 1

  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Lint the WordPress plugin
        run: |
          found=0
          while IFS= read -r file; do
            found=1
            php -l "$file"
          done < <(find wordpress -name '*.php' -type f)
          [ "$found" = "1" ] || { echo "No plugin PHP files found"; exit 1; }

      - name: Validate the Elementor kit JSON
        run: |
          found=0
          while IFS= read -r file; do
            found=1
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
            echo "valid: $file"
          done < <(find wordpress -name '*.json' -type f)
          [ "$found" = "1" ] || { echo "No Elementor kit JSON found"; exit 1; }
